---
version: '3'

tasks:
  run:
    desc: Run an artisan command (e.g. task artisan:run -- make:model Foo)
    cmd: php artisan {{.CLI_ARGS}}

  migrate:
    desc: Run database migrations
    cmd: php artisan migrate

  migrate_fresh:
    desc: Drop all tables and re-run migrations (destructive)
    cmd: php artisan migrate:fresh

  seed:
    desc: Seed the database
    cmd: php artisan db:seed

  key_check:
    desc: Generate the application key when APP_KEY is empty
    silent: true
    status:
      - test -n "$$(grep -E '^APP_KEY=.+' .env 2>/dev/null)"
    cmds:
      - php artisan key:generate

  config_clear:
    desc: Clear the cached configuration
    cmd: php artisan config:clear

  wayfinder:
    desc: Regenerate Wayfinder route/action bindings (gitignored, required before frontend checks)
    cmd: php artisan wayfinder:generate --with-form --no-interaction

  schedule_work:
    desc: Run the Laravel task scheduler in the foreground (dev parity for the prod scheduler service)
    cmd: php artisan schedule:work
