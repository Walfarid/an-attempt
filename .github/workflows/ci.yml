# Multi-stage CI pipeline for walfa.
#
# Stages (parallel where possible):
#   backend-static   Pint code style + PHPStan/Larastan static analysis
#   frontend         ESLint + Prettier + vue-tsc + Vite production build
#   tests            Pest suite (unit + feature) against MariaDB 12.3 + Garage
#   sca-composer     Composer audit (known advisories in locked PHP deps)
#   ci-ok            Aggregate gate for branch protection
#
# Versions verified 2026-08-23 (all refs pinned to immutable commit SHAs):
#   actions/checkout v7 · actions/setup-node v7 · shivammathur/setup-php v2
#   PHP 8.5 stable · Node 24

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static:
    name: Static analysis (Pint + PHPStan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, zip, curl, intl, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Pint (code style)
        run: vendor/bin/pint --test --parallel

      - name: PHPStan / Larastan
        run: vendor/bin/phpstan analyse --no-progress

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, zip, curl, intl
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Frontend code imports Wayfinder route/action bindings, which are
      # generated (and gitignored) — regenerate before any check or build.
      - name: Generate Wayfinder bindings
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: ESLint
        run: npm run lint:check

      - name: Prettier
        run: npm run format:check

      - name: vue-tsc (TypeScript)
        run: npm run types:check

      - name: Vite production build
        run: npm run build

  tests:
    name: Tests (Pest unit + feature)
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: walfa_testing
          MARIADB_USER: laravel
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, zip, curl, intl, pdo_mysql
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Feature tests render Inertia views through Blade, which resolves the
      # Vite build manifest — without built assets every page returns 500.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Generate Wayfinder bindings
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Install and build frontend assets
        run: |
          npm ci
          npm run build

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      # Feature tests upload/delete media through the S3-compatible "media"
      # disk (Garage in dev). Start the same Garage image locally in this
      # job; the dev credentials and bucket come from .env so no secrets
      # appear in the workflow. Garage auto-provisions the bucket + key
      # from GARAGE_DEFAULT_* via `--single-node --default-bucket`.
      - name: Start Garage (S3 for media tests)
        run: |
          set -a
          . ./.env
          set +a
          docker run -d --name walfa-garage-ci \
            -p 127.0.0.1:3900:3900 \
            -e GARAGE_DEFAULT_ACCESS_KEY="$GARAGE_ACCESS_KEY_ID" \
            -e GARAGE_DEFAULT_SECRET_KEY="$GARAGE_SECRET_ACCESS_KEY" \
            -e GARAGE_DEFAULT_BUCKET="$GARAGE_BUCKET" \
            -v "${{ github.workspace }}/docker/garage/garage.toml:/etc/garage.toml:ro" \
            -v walfa-garage-ci:/var/lib/garage \
            dxflrs/garage:5b6d138035db7c8b036136921c478f217a61f4e3 \
            /garage server --single-node --default-bucket
          for i in $(seq 1 30); do
            docker exec walfa-garage-ci /garage status >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs walfa-garage-ci
          exit 1

      - name: Run test suite
        run: php artisan config:clear --ansi && php artisan test

  sca-composer:
    name: SCA (Composer audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Audit locked dependencies against advisory DBs
        run: composer audit --locked

  ci-ok:
    name: CI gate
    needs: [backend-static, frontend, tests, sca-composer]
    runs-on: ubuntu-latest
    steps:
      - name: All CI stages passed
        run: echo "Backend static analysis, frontend checks, tests, and dependency audit passed."
