# DAST — OWASP ZAP baseline scan against an ephemeral, seeded app instance.
#
# Boots the full Laravel stack (MariaDB service + built frontend assets +
# `php artisan serve`), then runs the ZAP baseline scan (spider + passive
# rules) over the public pages. Active scanning is intentionally not enabled:
# the baseline profile is non-intrusive and safe to run on PRs and nightly.
#
# Versions verified 2026-08-23: ghcr.io/zaproxy/zaproxy stable image,
# actions/upload-artifact v7.

name: DAST

on:
  pull_request:
  schedule:
    - cron: '30 3 * * *' # Nightly 03:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: walfa_dast
          MARIADB_USER: laravel
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, xml, zip, curl, intl, pdo_mysql
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      # The Vite build imports Wayfinder route/action bindings, which are
      # generated (and gitignored) — regenerate before building.
      - name: Generate Wayfinder bindings
        run: php artisan wayfinder:generate --with-form --no-interaction

      - name: Build frontend assets
        run: npm run build

      - name: Prepare application environment
        run: |
          cp .env.example .env
          cat >> .env <<'EOF'
          APP_ENV=production
          APP_DEBUG=false
          APP_URL=http://127.0.0.1:8080
          DB_CONNECTION=mariadb
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_DATABASE=walfa_dast
          DB_USERNAME=laravel
          DB_PASSWORD=secret
          MAIL_MAILER=log
          EOF
          php artisan key:generate --force

      - name: Migrate and seed
        run: |
          php artisan migrate --force
          php artisan db:seed --force

      - name: Start application
        run: |
          mkdir -p storage/logs
          php artisan serve --host=127.0.0.1 --port=8080 > storage/logs/dast-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8080 > /dev/null; then
              echo "Application is up."
              exit 0
            fi
            sleep 1
          done
          echo "Application failed to start:"
          cat storage/logs/dast-server.log
          exit 1

      # --network host lets the ZAP container reach the app on the runner's
      # loopback interface; reports are written into the mounted workspace.
      # -I keeps WARN-level alerts non-failing; FAIL rules still gate the run.
      - name: Run ZAP baseline scan
        run: >
          docker run --rm --network host
          --volume "$PWD:/zap/wrk:rw"
          ghcr.io/zaproxy/zaproxy:stable
          zap-baseline.py
          -t http://127.0.0.1:8080
          -c .zap/rules.tsv
          -r zap-report.html
          -J zap-report.json
          -a
          -I

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: zap-baseline-report
          path: |
            zap-report.html
            zap-report.json
          retention-days: 14

      - name: Stop application
        if: always()
        run: pkill -f "artisan serve" || true
