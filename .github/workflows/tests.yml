name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # phpunit.xml points the suite at MariaDB (walfa_testing); without this
    # service every feature test fails on connection refused.
    services:
      mariadb:
        image: mariadb:12.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: walfa_testing
          MARIADB_USER: laravel
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Setup Application
        run: composer setup

      # Wayfinder bindings are gitignored; composer ci:check runs vue-tsc,
      # which needs them regenerated before the checks.
      - name: Generate Wayfinder bindings
        run: php artisan wayfinder:generate --with-form --no-interaction

      # Media tests upload/delete through the S3-compatible "media" disk
      # (Garage in dev). Docker-in-job starts the same Garage image used by
      # compose.yaml; credentials and bucket are sourced from .env (created
      # by composer setup), so no secrets live in this workflow. Garage
      # auto-provisions the bucket + key via --single-node --default-bucket.
      - name: Start Garage (S3 for media tests)
        run: |
          set -a
          . ./.env
          set +a
          docker run -d --name walfa-garage-ci \
            -p 127.0.0.1:3900:3900 \
            -e GARAGE_DEFAULT_ACCESS_KEY="$GARAGE_ACCESS_KEY_ID" \
            -e GARAGE_DEFAULT_SECRET_KEY="$GARAGE_SECRET_ACCESS_KEY" \
            -e GARAGE_DEFAULT_BUCKET="$GARAGE_BUCKET" \
            -v "${{ github.workspace }}/docker/garage/garage.toml:/etc/garage.toml:ro" \
            -v walfa-garage-ci:/var/lib/garage \
            dxflrs/garage:5b6d138035db7c8b036136921c478f217a61f4e3 \
            /garage server --single-node --default-bucket
          for i in $(seq 1 30); do
            docker exec walfa-garage-ci /garage status >/dev/null 2>&1 && exit 0
            sleep 1
          done
          docker logs walfa-garage-ci
          exit 1

      - name: Run CI Checks
        run: composer ci:check
