# Security scanning suite for walfa.
#
# Jobs:
#   secret-scan            gitleaks — hardcoded secrets across full git history
#   actions-security       zizmor — GitHub Actions workflow misconfigurations
#   sast-codeql            CodeQL SAST (JavaScript/TypeScript)
#   sast-php               Semgrep SAST for PHP (CodeQL dropped PHP support)
#   sca-dependency-review  PR dependency diff review (SCA gate)
#   osv-scan-pr / -full    OSV-Scanner against the OSV.dev database (SCA deep)
#
# Versions verified 2026-08-27:
#   actions/checkout v7 · gitleaks-action v3 · zizmor-action v0.6.2
#   codeql-action v4.37.8 · dependency-review-action v5 · osv-scanner-action v2.5.1
#
# Placeholder Garage credentials in .env.example / compose.yaml are dev-only
# and allowlisted in .gitleaks.toml.

name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions: {}

jobs:
  secret-scan:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # full history so existing commits are scanned too
          persist-credentials: false

      - name: Scan for hardcoded secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The SARIF artifact upload crashes when a clean scan produces no
          # results.sarif; findings still fail the job, so skip the upload.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  actions-security:
    name: Actions security (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Audit GitHub Actions workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false # report in the job log; flip to true for Code Scanning UI

  sast-codeql:
    name: SAST (CodeQL · javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write # required by codeql-action to upload SARIF results
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # CodeQL dropped PHP support ("Did not recognize the following
        # languages: php"); PHP is covered by the Semgrep job below.
        language: [javascript-typescript]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          category: '/language:${{ matrix.language }}'

  # Semgrep CE replaces the PHP leg CodeQL dropped. Registry rulesets run
  # token-less; findings land in Code Scanning via upload-sarif.
  sast-php:
    name: SAST (Semgrep · PHP)
    runs-on: ubuntu-latest
    permissions:
      actions: read # required by codeql-action/upload-sarif
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Scan PHP sources
        run: >
          docker run --rm --volume "$PWD:/src" --workdir /src
          semgrep/semgrep@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
          semgrep scan --metrics=off
          --config=p/php --config=p/security-audit --config=p/secrets
          --sarif --output=semgrep.sarif app/ resources/views/

      - name: Upload SARIF to Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@37f2634a92ba38a0926ef79a0748ac8ae7d95ab2 # v4.37.8
        with:
          sarif_file: semgrep.sarif

  sca-dependency-review:
    name: SCA (Dependency review)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review pull-request dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  osv-scan-pr:
    name: SCA (OSV-Scanner · PR diff)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read # the reusable workflow's jobs request this for Code Scanning uploads
      contents: read
      security-events: write # reusable workflow uploads findings to Code Scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./

  osv-scan-full:
    name: SCA (OSV-Scanner · full)
    if: github.event_name != 'pull_request'
    permissions:
      actions: read # the reusable workflow's jobs request this for Code Scanning uploads
      contents: read
      security-events: write # reusable workflow uploads findings to Code Scanning
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --recursive
        ./
