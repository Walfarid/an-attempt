; Real OPcache configuration for the FrankenPHP production image.
;
; The `PHP_OPCACHE_*` env vars the Dockerfile used to set are NOT read by
; this image: they only land in $_ENV/$_SERVER and never become ini
; directives (verified 2026-08-31 against dunglas/frankenphp:1.12.7-php8.5-
; bookworm: php -i stayed at compile-time defaults with the vars set).
; This file is what actually reaches php.ini via the conf.d scan dir.
;
; Base-image facts (same verification): opcache is compiled in statically
; and `opcache.enable` defaults to On; JIT defaults to disable; JIT buffer
; defaults to 64M. App code is baked into the image and storage is the only
; mounted tree, so timestamp validation can be off safely (the octane:reload
; on deploy respawns workers with the new image's code).

opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.revalidate_freq=0
opcache.max_accelerated_files=20000
opcache.jit=tracing
opcache.jit_buffer_size=64M